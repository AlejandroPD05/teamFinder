name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Supabase local
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Variables de entorno locales
        run: |
          npx supabase status -o env \
            | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY)=' \
            | sed -e 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/' \
                  -e 's/^PUBLISHABLE_KEY=/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=/' \
                  -e 's/^SECRET_KEY=/SUPABASE_SECRET_KEY=/' \
                  -e 's/"//g' >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"

      - name: Tipos de BD al día
        run: npm run db:types && git diff --exit-code src/lib/supabase/database.types.ts

      - run: npm run lint
      - run: npm run test
      - run: npm run build

      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
