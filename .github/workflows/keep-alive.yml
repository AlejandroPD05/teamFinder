# Mantiene despierto el proyecto gratuito de Supabase, que se pausa tras ~7 días sin actividad.
# Pide cada 3 días una página pública de producción que consulta Supabase desde el servidor.
# No necesita secretos: es la misma petición que haría cualquier visitante.
# Ojo: GitHub desactiva los workflows programados de un repo público tras 60 días sin commits;
# si pasa, se reactiva desde la pestaña Actions.
name: Keep-alive Supabase

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pedir una página que lee de Supabase
        env:
          URL: https://teamfinder-seven.vercel.app/equipos/valorant
        run: |
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 20 --retry-all-errors \
            --max-time 30 \
            --output /dev/null \
            --write-out "HTTP %{http_code} en %{time_total}s\n" \
            "$URL"
